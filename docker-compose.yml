services:
  postgres:
    image: postgres:16
    container_name: risk-postgres
    environment:
      POSTGRES_DB: risk_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - risk-postgres-data:/var/lib/postgresql/data

  ml-service:
    build: ./ml-risk-model
    container_name: risk-ml-service
    ports:
      - "5001:5001"

  springboot-app:
    build: .
    container_name: risk-springboot-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ml-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/risk_analyzer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ML_SERVICE_URL: http://ml-service:5001
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}

volumes:
  risk-postgres-data: