name: Java CI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean install

      - name: API Test - Simulated 404 Failure
        run: |
          echo "GET /api/users"
          echo "Expected HTTP status 200 but received 404"
          echo "404 Not Found"
          echo "The requested API endpoint or resource could not be found."
          exit 1