name: Java CI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean install

      - name: Artifact Integrity Failure
        run: |
          echo "Artifact integrity validation failed"
          echo "Generated application artifact does not match expected checksum"
          echo "Artifact may be corrupted and cannot be safely deployed"
          exit 1
