name: Java CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: API Test
        run: |
          echo "HTTP status 404"
          echo "404 Not Found"
          exit 1