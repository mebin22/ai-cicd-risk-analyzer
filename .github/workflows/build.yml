name: Java CI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean install

      - name: Docker Build Failure Test
        run: |
          echo "Starting Docker image build..."
          echo "Docker build failed"
          echo "ERROR: failed to solve: eclipse-temurin:21-jre"
          echo "pull access denied"
          echo "repository does not exist or may require authorization"
          exit 1