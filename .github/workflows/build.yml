name: Java CI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean install

      - name: Database Connection Failure Test
        run: |
          echo "Starting database integration test..."
          echo "Connecting to PostgreSQL database..."
          echo "org.postgresql.util.PSQLException: Connection to postgres:5432 refused"
          echo "Check that the hostname and port are correct and that the database is accepting TCP/IP connections."
          echo "Database integration test failed"
          echo "Process completed with exit code 1"
          exit 1