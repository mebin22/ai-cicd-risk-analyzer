name: Java CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Optional Quality Check
        continue-on-error: true
        run: |
          echo "Warning: code coverage is below threshold"
          echo "Warning: manual review is required"
          echo "Non-critical quality check failed"
          exit 1

      - name: Build Project
        run: mvn clean package