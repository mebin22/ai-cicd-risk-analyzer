name: Java CI Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean install

      - name: Dependency Warning - Medium Risk
        run: |
          echo "Dependency version warning detected."
          echo "A dependency is using an outdated version."
          echo "Build completed but dependency should be reviewed before deployment."
          echo "Warning: dependency update recommended."