name: Java CI Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Run Unit Tests
        run: |
          echo "Running UserServiceTest..."
          echo "Expected HTTP status 200 but received 500"
          echo "AssertionError: expected 200 but was 500"
          echo "UserServiceTest failed"
          exit 1